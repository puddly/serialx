# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch", "dev"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "codespell"
name = "codespell"
entry = "uv run --frozen --group dev codespell --toml pyproject.toml"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run --frozen --group dev ruff check --force-exclude --fix"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run --frozen --group dev ruff format --force-exclude"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "v3.8.3"

[[repos.hooks]]
id = "prettier"
files = '^tests/data/pyodide/.*\.(ts|json)$'

[[repos]]
repo = "https://github.com/google/yamlfmt"
rev = "v0.21.0"

[[repos.hooks]]
id = "yamlfmt"
args = ["-formatter", "retain_line_breaks=true"]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"

[[repos.hooks]]
id = "taplo-format"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy"
entry = "uv run --frozen --group dev mypy"
language = "system"
types_or = ["python", "pyi"]
exclude = '^tests/esphome/external_components/'
require_serial = true

[[repos.hooks]]
id = "pylint"
name = "pylint"
entry = "uv run --frozen --group dev pylint serialx/"
language = "system"
types = ["python"]
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "cargo-fmt"
name = "Cargo fmt"
entry = "cargo fmt --all"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "cargo-check"
name = "Cargo check"
entry = "cargo check --workspace"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "rust-clippy"
name = "Cargo clippy"
entry = "cargo clippy --all-targets --all-features -- -Dclippy::all -Dclippy::nursery"
language = "system"
pass_filenames = false

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.24.1"

[[repos.hooks]]
id = "zizmor"
args = ["--pedantic"]
