[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "serialx-compat"
version = "0.0.0" # Rewritten by CI to match the serialx version
description = "Compatibility package exposing pyserial-style imports backed by serialx"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "puddly", email = "puddly3@gmail.com" }]
dependencies = [
  "serialx",
] # Rewritten to serialx==<release version> by release CI

[project.optional-dependencies]
esphome = ["serialx[esphome]"]

[project.urls]
Repository = "https://github.com/puddly/serialx"

[tool.setuptools]
py-modules = ["serial_asyncio", "serial_asyncio_fast"]

[tool.setuptools.packages.find]
include = ["serial", "serial.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
show_error_context = true
